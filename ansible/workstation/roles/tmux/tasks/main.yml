- name: Link the tmux configuration files
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ tmux_config_src }}"
      dest: "{{ tmux_config_dest }}"
    - src: "{{ tmux_sessionizer_src }}"
      dest: "{{ tmux_sessionizer_dest }}"
  loop_control:
    label: "{{ item.dest }}"
