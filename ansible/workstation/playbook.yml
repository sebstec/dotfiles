# ansible-playbook playbook.yml -i inventory/localhost.yml -u sbw -K --diff --tags apps --check
- name: Provision Fedora workstation
  hosts: workstation
  gather_facts: true
  roles:
    - role: base
      tags: base
    - role: docker
      tags: docker
    - role: iptables
      tags: iptables
    - role: gnome_extensions
      tags: gnome_extensions
    - role: apps
      tags: apps
    - role: firefox
      tags: firefox
      when: not (workstation_local | default(false))
    - role: ssh
      tags: ssh
      when: not (workstation_local | default(false))
    - role: dotfiles
      tags: dotfiles
    - role: zsh
      tags:
        - zsh
        - dotfiles
    - role: kitty
      tags:
        - kitty
        - dotfiles
    - role: tmux
      tags:
        - tmux
        - dotfiles
    - role: neovim
      tags: neovim
    - role: opencode
      tags: opencode
