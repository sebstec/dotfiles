[[keyboard.bindings]]
key = 0
mods = "Alt"

[keyboard.bindings.command]
args = ["-e", "vttest"]
program = "alacritty"

[window]
decorations = "none"
# gtk_theme_variant = "none"
opacity = 0.95
# opacity = 0.55
# opacity = 1.00

[window.padding]
x = 5
y = 5

[cursor]
[cursor.style]
shape = 'underline'
blinking = 'Off'

[font.normal]
family = 'SauceCodePro Nerd Font'

[general]
import = ["~/.config/alacritty-theme/themes/iterm.toml"]
# import = ["~/.config/alacritty-theme/themes/baitong.toml"]
# import = ["~/.config/alacritty-theme/themes/ayu_light.toml"]
