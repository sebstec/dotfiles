---
- name: Require a real run
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: "The iptables role prefers saved rules and enables them for the next boot; run it without --check."

- name: Verify target is Fedora
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Fedora"
    fail_msg: "This role supports Fedora only."

- name: Install iptables services
  ansible.builtin.dnf:
    name:
      - iptables-services
      - iptables-nft
    state: present
  become: true

- name: Configure the IPv4 rules
  ansible.builtin.template:
    src: iptables.rules.j2
    dest: "{{ iptables_rules_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure the IPv6 rules
  ansible.builtin.template:
    src: ip6tables.rules.j2
    dest: "{{ ip6tables_rules_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Validate the IPv4 rules
  ansible.builtin.command:
    argv:
      - iptables-restore
      - --test
    stdin: "{{ lookup('template', 'iptables.rules.j2') }}"
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Validate the IPv6 rules
  ansible.builtin.command:
    argv:
      - ip6tables-restore
      - --test
    stdin: "{{ lookup('template', 'ip6tables.rules.j2') }}"
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Enable the iptables services without starting them
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: stopped
  loop:
    - "{{ iptables_service }}"
    - "{{ ip6tables_service }}"
  become: true

- name: Mask firewalld without stopping the running service
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: false
    masked: true
  become: true

- name: Check for the nftables service
  ansible.builtin.command:
    cmd: systemctl list-unit-files nftables.service
  register: iptables_nftables_unit
  changed_when: false
  failed_when: false
  check_mode: false

- name: Mask nftables without stopping the running service
  ansible.builtin.systemd_service:
    name: nftables
    enabled: false
    masked: true
  become: true
  when: "'nftables.service' in iptables_nftables_unit.stdout"

- name: Ensure the Docker drop-in directory
  ansible.builtin.file:
    path: "{{ iptables_docker_dropin | dirname }}"
    state: directory
    mode: "0755"
  become: true

- name: Order Docker after the iptables services
  ansible.builtin.copy:
    dest: "{{ iptables_docker_dropin }}"
    content: |
      [Unit]
      After=iptables.service ip6tables.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd after adding the Docker drop-in
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Check the saved IPv4 rules
  ansible.builtin.stat:
    path: "{{ iptables_rules_file }}"
  register: iptables_rules_stat

- name: Require the saved IPv4 rules
  ansible.builtin.assert:
    that:
      - iptables_rules_stat.stat.exists | default(false)
      - iptables_rules_stat.stat.isreg | default(false)
    fail_msg: "Missing {{ iptables_rules_file }}."

- name: Check the saved IPv6 rules
  ansible.builtin.stat:
    path: "{{ ip6tables_rules_file }}"
  register: ip6tables_rules_stat

- name: Require the saved IPv6 rules
  ansible.builtin.assert:
    that:
      - ip6tables_rules_stat.stat.exists | default(false)
      - ip6tables_rules_stat.stat.isreg | default(false)
    fail_msg: "Missing {{ ip6tables_rules_file }}."

- name: Check the Docker drop-in
  ansible.builtin.stat:
    path: "{{ iptables_docker_dropin }}"
  register: iptables_docker_dropin_stat

- name: Require the Docker drop-in
  ansible.builtin.assert:
    that:
      - iptables_docker_dropin_stat.stat.exists | default(false)
    fail_msg: "Missing {{ iptables_docker_dropin }}."

- name: Read the iptables service enabled state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ item }}"
  loop:
    - "{{ iptables_service }}"
    - "{{ ip6tables_service }}"
  register: iptables_service_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the iptables services to be enabled
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | trim) == "enabled"
    fail_msg: "{{ item.item }} is not enabled."
  loop: "{{ iptables_service_enabled.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the iptables service active state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item }}"
  loop:
    - "{{ iptables_service }}"
    - "{{ ip6tables_service }}"
  register: iptables_service_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the iptables services to remain stopped
  ansible.builtin.assert:
    that:
      - (item.stdout | trim) != "active"
    fail_msg: "{{ item.item }} is active; the role must not apply the rules now."
  loop: "{{ iptables_service_active.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read the firewalld enabled state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - firewalld
  register: iptables_firewalld_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require firewalld to be masked
  ansible.builtin.assert:
    that:
      - (iptables_firewalld_enabled.stdout | trim) == "masked"
    fail_msg: "firewalld is not masked."

- name: Show the activation instructions
  ansible.builtin.pause:
    prompt: |
      The iptables rules are saved but NOT applied.
      They will be applied at the next boot.
      firewalld is masked but still running.
      Docker was NOT restarted.

      To apply now, manually:
        sudo systemctl stop docker
        sudo systemctl start iptables ip6tables
        sudo systemctl start docker

      Press Enter to finish.
  when: not ansible_check_mode
