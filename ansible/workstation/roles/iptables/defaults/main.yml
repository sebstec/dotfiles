iptables_rules_file: /etc/sysconfig/iptables
ip6tables_rules_file: /etc/sysconfig/ip6tables
iptables_service: iptables
ip6tables_service: ip6tables
iptables_docker_dropin: /etc/systemd/system/docker.service.d/10-after-iptables.conf

iptables_ssh_allow_sources:
  - 192.168.1.0/24

ip6tables_ssh_allow_sources:
  - fe80::/64
